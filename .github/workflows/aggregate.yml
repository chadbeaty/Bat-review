name: Collect player reviews

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Collect posts and score them
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/aggregate.mjs
      - name: Commit updated data
        run: |
          git config user.name "barrel-talk-bot"
          git config user.email "barrel-talk-bot@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update player reviews"
            git push
          fi
