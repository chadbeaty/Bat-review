name: "Product Radar: checks"

on:
  push:
    paths: ["productradar/**", ".github/workflows/productradar-ci.yml"]
  pull_request:
    paths: ["productradar/**", ".github/workflows/productradar-ci.yml"]

defaults:
  run:
    working-directory: productradar

jobs:
  checks:
    name: Lint, types, unit, database and pipeline tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The build runs without real credentials; pages show their "setup needed" state.
      NEXT_PUBLIC_SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: productradar/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit, database (migrations, RLS) and end-to-end pipeline tests
        run: npm test
      - run: npm run build
