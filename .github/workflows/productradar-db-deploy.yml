# Applies productradar/supabase/migrations to a hosted Supabase project.
# Run it by hand: GitHub → Actions → "Product Radar: deploy database" → Run workflow.
# Needs repository secrets (Settings → Secrets and variables → Actions):
#   PRODUCTRADAR_SUPABASE_ACCESS_TOKEN (or SUPABASE_ACCESS_TOKEN) – from supabase.com/dashboard/account/tokens
#   PRODUCTRADAR_SUPABASE_DB_PASSWORD  (or SUPABASE_DB_PASSWORD)  – the project's database password
name: "Product Radar: deploy database"

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Supabase project ref (the part before .supabase.co)
        required: true

jobs:
  push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: productradar
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTRADAR_SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTRADAR_SUPABASE_DB_PASSWORD || secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "${{ inputs.project_ref }}"
      - run: supabase db push --remote --yes
