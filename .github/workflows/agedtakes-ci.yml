name: "Aged Takes: checks"

on:
  push:
    paths: ["agedtakes/**", ".github/workflows/agedtakes-ci.yml"]
  pull_request:
    paths: ["agedtakes/**", ".github/workflows/agedtakes-ci.yml"]

defaults:
  run:
    working-directory: agedtakes

jobs:
  checks:
    name: Lint, types, unit and database tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The build runs without real credentials; pages render their "setup needed" state.
      NEXT_PUBLIC_SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agedtakes/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and database tests (migrations, RLS, publishing safeguards)
        run: npm test
      - run: npm run build
