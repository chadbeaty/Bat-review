name: "SwingIQ: checks"

on:
  push:
    paths: ["swingiq/**", ".github/workflows/swingiq-ci.yml"]
  pull_request:
    paths: ["swingiq/**", ".github/workflows/swingiq-ci.yml"]

defaults:
  run:
    working-directory: swingiq

jobs:
  checks:
    name: Lint, types, engine and database tests, build, browser tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: swingiq/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Engine and database tests
        run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Download the real swing clip for the live-camera test
        id: clip
        continue-on-error: true
        run: ./scripts/fetch-test-video.sh
      - name: Browser tests (pages on phone + desktop, live camera with a real swing)
        run: npm run test:e2e
